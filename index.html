<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist Técnico · Sonda</title>
<!--
SUPABASE (rode uma vez no SQL Editor):
create table sonda_kv(k text primary key, v jsonb, updated_at timestamptz default now());
alter table sonda_kv enable row level security;
create policy "mvp_all" on sonda_kv for all using (true) with check (true);
Depois preencha SB_URL e SB_KEY (anon key) no início do <script>.
Sem preencher, o app roda em MODO LOCAL (só neste navegador, serve para testar).
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--az:#1F5DF5;--azd:#0B2A7A;--lar:#8FB2FF;--bg:#F3F6FF;--ok:#1E9E5A;--no:#D93A3A;--tx:#1B2430;--mut:#6B7788;--bd:#DCE4F7}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:80px}
header{background:linear-gradient(120deg,var(--az) 0%,#1747C9 100%);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px rgba(31,93,245,.35)}
header .logo{height:44px;object-fit:contain}
header .wm{font-weight:800;font-size:22px;letter-spacing:1px;background:#fff;color:var(--az);border-radius:8px;padding:2px 12px}
header h1{font-size:15px;margin:0;flex:1;line-height:1.25;padding-left:12px;border-left:2px solid rgba(255,255,255,.35)}header h1 small{display:block;font-weight:400;opacity:.8;font-size:12px}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}header{flex-wrap:wrap}
nav button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
nav button.on{background:#fff;color:var(--az)}
main{max-width:860px;margin:0 auto;padding:14px}
.banner{background:#FFF4E5;border:1px solid var(--lar);color:#8a4b00;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(8,37,79,.06)}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--az)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.mut{color:var(--mut);font-size:13px}
.tag{background:#E6EEFA;color:var(--az);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.bar{height:10px;background:#E6EBF3;border-radius:10px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--az),var(--ok));transition:width .3s}
button.pri{background:var(--az);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;cursor:pointer}
button.lar{background:var(--azd);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}
button.sec{background:#fff;color:var(--az);border:1.5px solid var(--az);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.hero{background:linear-gradient(120deg,var(--azd),var(--az));color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}.hero b{font-size:18px}.hero p{margin:4px 0 0;opacity:.85;font-size:13px}
button.del{background:#fff;color:var(--no);border:1.5px solid var(--no);border-radius:8px;padding:6px 10px;cursor:pointer}
label.f{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--azd)}
input,select,textarea{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:10px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--az)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}header h1 small{display:none}}
h2.g{font-size:13px;text-transform:uppercase;letter-spacing:.9px;color:#fff;background:var(--azd);margin:22px 0 8px;padding:7px 12px;border-radius:8px}
.it{background:#fff;border:1px solid var(--bd);border-left:6px solid #C5CEDB;border-radius:12px;padding:12px;margin-bottom:10px}
.it.s-ok{border-left-color:var(--ok);background:#F3FBF6}.it.s-nok{border-left-color:var(--no);background:#FFF5F5}.it.s-na{border-left-color:#9AA5B5;background:#F6F7F9}
.it b.t{font-size:15px}.it small.d{display:block;color:var(--mut);margin-top:2px}
.ref{display:flex;gap:10px;align-items:center;background:#EAF0FF;border:1px dashed var(--az);border-radius:10px;padding:6px;margin:8px 0}
.ref img{width:90px;height:68px;object-fit:cover;border-radius:8px;cursor:zoom-in}.ref span{font-size:12px;color:var(--az);font-weight:600}
.btns{display:flex;gap:6px;margin:8px 0}
.btns button{flex:1;padding:10px 4px;border-radius:10px;border:1.5px solid var(--bd);background:#fff;font-weight:700;cursor:pointer;font-size:14px}
.btns .ok.on{background:var(--ok);color:#fff;border-color:var(--ok)}.btns .nok.on{background:var(--no);color:#fff;border-color:var(--no)}.btns .na.on{background:#6B7788;color:#fff;border-color:#6B7788}
textarea{min-height:44px;resize:vertical;font-size:14px}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fotos .ph{position:relative}.fotos img{width:78px;height:78px;object-fit:cover;border-radius:10px;cursor:zoom-in}
.fotos .ph button{position:absolute;top:-6px;right:-6px;background:var(--no);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer}
.fotos label.add{width:78px;height:78px;border:2px dashed var(--az);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--az);font-size:12px;font-weight:700;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:#E6EBF3;font-weight:700;cursor:pointer}.tabs button.on{background:var(--az);color:#fff}
.tl{border-left:3px solid var(--az);margin-left:8px;padding-left:14px}.tl div{margin-bottom:12px;position:relative}.tl div:before{content:"";position:absolute;left:-22px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--lar)}
.tl small{color:var(--mut)}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ed .full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;border-top:4px solid var(--az)}.kpi b{display:block;font-size:28px;color:var(--azd)}.kpi span{font-size:12px;color:var(--mut)}
.kpi.late{border-top-color:var(--no)}.kpi.done{border-top-color:var(--ok)}
.st{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.st-exec{background:#DDF5E8;color:#127a43}.st-ag{background:#E8EFFF;color:var(--az)}.st-pausa{background:#FFF1D6;color:#8a5a00}.st-late{background:#FFE3E3;color:#b42323}.st-done{background:var(--ok);color:#fff}
.live{font-size:13px;color:var(--mut);margin-bottom:10px}.live i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.25}}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--azd);color:#fff;padding:10px 18px;border-radius:30px;opacity:0;transition:.3s;pointer-events:none;z-index:20}#toast.on{opacity:1}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:30}#zoom img{max-width:94%;max-height:92%;border-radius:10px}
</style>
</head>

<header id="hd"></header>
<main id="app"></main>
<div id="toast"></div>
<div id="zoom" onclick="this.style.display='none'"><img></div>

const SB_URL='', SB_KEY='';   // ← preencha para ativar o salvamento compartilhado (Supabase)
let TIPOS=['Micromercado MM','Cafeteria','Restaurante P','Restaurante PP','Restaurante M','Restaurante G','Restaurante GG','Demanda avulsa'];
const ST={ok:'Feito',nok:'Com problema',na:'Não se aplica',p:'Pendente'};
const P=new URLSearchParams(location.search), FORN=P.has('c');
const S={view:'list',list:[],cur:null,tab:'chk',tpl:null,tipo:TIPOS[0],q:'',logo:null,user:null,at:null,users:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
function zoom(src){const z=document.getElementById('zoom');z.querySelector('img').src=src;z.style.display='flex'}

/* ---------- Armazenamento (Supabase REST ou local) ---------- */
const H=SB_URL?{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}:{};
const DB={
  async get(k){if(!SB_URL){const v=localStorage.getItem('kv:'+k);return v?JSON.parse(v):null}
    const r=await fetch(`${SB_URL}/rest/v1/sonda_kv?k=eq.${encodeURIComponent(k)}&select=v`,{headers:H});const j=await r.json();return j[0]?j[0].v:null},
  async set(k,v){if(!SB_URL){localStorage.setItem('kv:'+k,JSON.stringify(v));return}
    const r=await fetch(`${SB_URL}/rest/v1/sonda_kv?on_conflict=k`,{method:'POST',headers:{...H,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify({k,v,updated_at:new Date().toISOString()})});
    if(!r.ok)throw new Error('Falha ao salvar')},
  async list(p){if(!SB_URL)return Object.keys(localStorage).filter(x=>x.startsWith('kv:'+p)).map(x=>JSON.parse(localStorage.getItem(x)));
    const r=await fetch(`${SB_URL}/rest/v1/sonda_kv?k=like.${encodeURIComponent(p)}*&select=v`,{headers:H});return(await r.json()).map(x=>x.v)},
  async del(k){if(!SB_URL){localStorage.removeItem('kv:'+k);return}
    await fetch(`${SB_URL}/rest/v1/sonda_kv?k=eq.${encodeURIComponent(k)}`,{method:'DELETE',headers:H})}
};

/* ---------- Modelos padrão (ponto de partida – o time edita no app) ---------- */
const G={
 'Antes de iniciar':[['Foto do local antes da obra','Registrar o estado inicial do ambiente'],['Check-in com o responsável da unidade']],
 'Cabeamento de rede':[['Passagem de cabos e eletrodutos','Cabos organizados, sem emendas'],['Identificação dos pontos (etiquetas)'],['Certificação dos pontos','Anexar foto do relatório do testador']],
 'Rack e Switch':[['Instalação do rack / patch panel'],['Organização e identificação do patch panel']],
 'CFTV':[['Instalação das câmeras','Ângulo conforme projeto'],['Configuração do gravador (NVR/DVR)'],['Acesso remoto testado']],
 'Equipamentos de venda':[['Instalação do totem / PDV'],['Instalação do leitor / terminal de pagamento'],['Teste de venda ponta a ponta']],
 'Energia e Wi-Fi':[['Pontos de energia / nobreak'],['Cobertura Wi-Fi validada']],
 'Encerramento':[['Limpeza e organização da área'],['Foto final geral do ambiente'],['Aceite do responsável da unidade']]
};
const MAPA={'Micromercado MM':Object.keys(G),'Cafeteria':['Antes de iniciar','Cabeamento de rede','Rack e Switch','Equipamentos de venda','Energia e Wi-Fi','Encerramento'],
 'Restaurante P':['Antes de iniciar','Cabeamento de rede','Rack e Switch','Energia e Wi-Fi','Encerramento'],'Restaurante PP':['Antes de iniciar','Cabeamento de rede','Rack e Switch','Encerramento'],
 'Restaurante M':['Antes de iniciar','Cabeamento de rede','Rack e Switch','CFTV','Energia e Wi-Fi','Encerramento'],'Restaurante G':['Antes de iniciar','Cabeamento de rede','Rack e Switch','CFTV','Equipamentos de venda','Energia e Wi-Fi','Encerramento'],
 'Restaurante GG':Object.keys(G),'Demanda avulsa':['Antes de iniciar','Cabeamento de rede','Encerramento']};
const padrao=t=>(MAPA[t]||MAPA['Demanda avulsa']).flatMap(g=>G[g].map(([n,d])=>({id:uid(),g,t:n,d:d||'',ref:null})));
async function getTpl(t){return(await DB.get('tpl:'+t))||padrao(t)}

/* ---------- Fotos ---------- */
function comp(file,max=900){return new Promise(r=>{const im=new Image,u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.7))};im.src=u})}

/* ---------- Identificação / histórico ---------- */
function quem(){if(S.user)return S.user.nome+' ('+PERF[S.user.perfil]+')';let n=localStorage.getItem('nome');if(!n){n=prompt('Qual é o seu nome?')||'Sem nome';localStorage.setItem('nome',n)}return n+' (Fornecedor)'}
async function save(msg){const c=S.cur;c.upd=Date.now();if(msg)c.hist.unshift({ts:Date.now(),quem:quem(),txt:msg});
  try{await DB.set('chamado:'+c.id,c);await DB.set('resumo:'+c.id,resumo(c));toast('Salvo ✓')}catch(e){toast('⚠ Erro ao salvar')}
  const y=scrollY;render();scrollTo(0,y)}

/* ---------- Ações do checklist ---------- */
const item=id=>S.cur.itens.find(i=>i.id===id);
function setS(id,s){const i=item(id);i.s=i.s===s?'p':s;save(`"${i.t}" → ${ST[i.s]}`)}
function setObs(id,v){const i=item(id);if(i.obs===v)return;i.obs=v;save(`Observação em "${i.t}"`)}
async function addFoto(id,inp){const i=item(id);for(const f of inp.files)(i.fotos=i.fotos||[]).push(await comp(f));save(`Foto adicionada em "${i.t}"`)}
function rmFoto(id,k){const i=item(id);i.fotos.splice(k,1);save(`Foto removida de "${i.t}"`)}
function pct(c){if(c.pct!==undefined)return c.pct;const n=c.itens.length,d=c.itens.filter(i=>i.s==='ok'||i.s==='na').length;return n?Math.round(d/n*100):0}
function link(){const u=location.origin+location.pathname+'?c='+S.cur.id;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copiado!'),()=>prompt('Copie o link:',u))}

/* ---------- Telas ---------- */
function head(){
  const lg=`<img class="logo" src="${LOGO}" alt="Sonda">`;
  const sub=FORN&&S.cur?`Chamado ${esc(S.cur.num)} · ${esc(S.cur.unidade)}`:(S.user?esc(S.user.nome)+' · '+PERF[S.user.perfil]:'Sodexo · Checklist de atividade técnica');
  const nav=(FORN||!S.user)?'':`<nav>${[['dash','📡 Painel'],['list','Chamados'],['tpl','Modelos'],...(can('user')?[['users','Usuários']]:[])].map(([v,l])=>`<button class="${S.view===v||(v==='list'&&(S.view==='chk'||S.view==='new'))?'on':''}" onclick="go('${v}')">${l}</button>`).join('')}<button onclick="sair()">Sair</button></nav>`;
  document.getElementById('hd').innerHTML=`${lg}<h1>Checklist Técnico<small>${sub}</small></h1>${nav}`}

function render(){head();const a=document.getElementById('app');
  const b=SB_URL?'':`<div class="banner">⚙ <b>Modo local (teste):</b> os dados ficam só neste navegador. Para o link funcionar com o fornecedor, configure o Supabase (instruções no início do arquivo).</div>`;
  a.innerHTML=b+({list:vList,new:vNew,chk:vChk,tpl:vTpl,dash:vDash,users:vUsers,login:vLogin,setup:vSetup}[S.view])()}

async function go(v){S.view=v;if(v==='list'||v==='dash'){S.list=await DB.list('resumo:');S.at=new Date()}if(v==='users')S.users=await DB.list('user:');
  if(v==='tpl'&&!S.tpl)S.tpl=await getTpl(S.tipo);render();scrollTo(0,0)}

function vList(){const ab=S.list.length,ok=S.list.filter(c=>pct(c)===100).length;
  const l=S.list.filter(c=>(c.num+c.unidade+c.fornecedor+c.cidade).toLowerCase().includes(S.q.toLowerCase())).sort((a,b)=>b.upd-a.upd);
  return `<div class="hero"><b>Olá! Vamos fazer o checklist?</b><p>${ab} chamado(s) · ${ok} concluído(s) · tudo é salvo automaticamente</p></div><div class="row" style="margin-bottom:12px"><input style="flex:1;min-width:160px" placeholder="🔎 Buscar chamado, unidade, fornecedor…" value="${esc(S.q)}" onchange="S.q=this.value;render()"><button class="lar" onclick="go('new')">＋ Novo chamado</button></div>`+
  (l.length?l.map(c=>`<div class="card click" onclick="abrir('${c.id}')"><div class="row"><b>#${esc(c.num)} · ${esc(c.unidade)}</b><span class="tag">${esc(c.tipo)}</span>${chip(c)}<span class="sp"></span><b style="color:var(--az)">${pct(c)}%</b></div>
   <div class="mut">${esc(c.fornecedor)} · ${esc(c.cidade)}/${esc(c.uf)} · agendado p/ ${dm(c.agenda||c.data)} · registrado em ${dm(c.data)} · atualizado ${fmt(c.upd)}</div><div class="bar"><i style="width:${pct(c)}%"></i></div></div>`).join(''):
  `<div class="card mut" style="text-align:center;padding:30px">Nenhum chamado ainda. Clique em <b>＋ Novo chamado</b> para começar.</div>`)}

function vNew(){return `<div class="card"><h3 style="margin-top:0;color:var(--azd)">Novo chamado</h3><div class="grid">
 <div><label class="f">Nº do chamado</label><input id="n_num"></div>
 <div><label class="f">Nome da unidade</label><input id="n_un"></div>
 <div><label class="f">Fornecedor</label><input id="n_fo"></div>
 <div><label class="f">Data do registro</label><input id="n_dt" type="date" value="${hoje()}"></div>
 <div><label class="f">Data agendada de execução</label><input id="n_ag" type="date" value="${hoje()}"></div>
 <div><label class="f">Cidade</label><input id="n_ci"></div>
 <div><label class="f">Estado (UF)</label><input id="n_uf" maxlength="2" style="text-transform:uppercase"></div></div>
 <label class="f">Tipo de estabelecimento (define o checklist)</label><select id="n_ti">${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select>
 <div class="row" style="margin-top:16px"><button class="pri" onclick="criar()">Criar checklist</button><button class="sec" onclick="go('list')">Cancelar</button></div></div>`}

async function criar(){const v=i=>document.getElementById(i).value.trim();
  if(!v('n_num')||!v('n_un')){return toast('Preencha o nº do chamado e a unidade')}
  const t=v('n_ti'),tpl=await getTpl(t);
  S.cur={id:'C'+Date.now().toString(36),num:v('n_num'),unidade:v('n_un'),fornecedor:v('n_fo'),data:v('n_dt'),agenda:v('n_ag')||v('n_dt'),cidade:v('n_ci'),uf:v('n_uf').toUpperCase(),tipo:t,
   itens:tpl.map(i=>({...i,s:'p',obs:'',fotos:[]})),hist:[],upd:Date.now()};
  S.tab='chk';S.view='chk';await save('Chamado criado');}

async function abrir(id){S.cur=await DB.get('chamado:'+id);if(!S.cur){document.getElementById('app').innerHTML='<div class="card">Checklist não encontrado.</div>';return}
  S.tab='chk';S.view='chk';render();scrollTo(0,0)}

function vChk(){const c=S.cur,gs=[...new Set(c.itens.map(i=>i.g))];
  const topo=`<div class="card"><div class="row"><b style="font-size:17px">#${esc(c.num)} · ${esc(c.unidade)}</b><span class="tag">${esc(c.tipo)}</span></div>
  <div class="mut">${esc(c.fornecedor)} · ${esc(c.cidade)}/${esc(c.uf)} · ${esc(c.data.split('-').reverse().join('/'))}</div>
  <div class="row" style="margin-top:6px"><b style="font-size:22px;color:var(--az)">${pct(c)}%</b><span class="mut">concluído · última atualização ${fmt(c.upd)}</span></div><div class="bar"><i style="width:${pct(c)}%"></i></div>
  ${FORN?'<p class="mut" style="margin-bottom:0">💾 Tudo é salvo automaticamente. Você pode fechar e voltar depois para continuar de onde parou.</p>':'<div class="row" style="margin-top:12px"><button class="pri" onclick="link()">🔗 Copiar link para o fornecedor</button><button class="sec" onclick="expZip()">📥 Fotos (ZIP)</button><button class="sec" onclick="book()">📄 Book (PDF)</button>'+(can('del')?'<button class="del" onclick="excluir()">Excluir</button>':'')+'</div>'}</div>
  <div class="tabs"><button class="${S.tab==='chk'?'on':''}" onclick="S.tab='chk';render()">Checklist</button><button class="${S.tab==='hist'?'on':''}" onclick="S.tab='hist';render()">Histórico (${c.hist.length})</button></div>`;
  if(S.tab==='hist')return topo+`<div class="card"><div class="tl">${c.hist.map(h=>`<div><b>${esc(h.txt)}</b><br><small>${esc(h.quem)} · ${fmt(h.ts)}</small></div>`).join('')||'<span class="mut">Sem registros.</span>'}</div></div>`;
  return topo+gs.map(g=>`<h2 class="g">${esc(g)}</h2>`+c.itens.filter(i=>i.g===g).map(i=>`<div class="it s-${i.s}"><b class="t">${esc(i.t)}</b>${i.d?`<small class="d">${esc(i.d)}</small>`:''}
   ${i.ref?`<div class="ref"><img src="${i.ref}" onclick="zoom(this.src)"><span>📌 Exemplo padrão: faça igual a esta foto</span></div>`:''}
   <div class="btns"><button class="ok ${i.s==='ok'?'on':''}" onclick="setS('${i.id}','ok')">✔ Feito</button><button class="nok ${i.s==='nok'?'on':''}" onclick="setS('${i.id}','nok')">⚠ Problema</button><button class="na ${i.s==='na'?'on':''}" onclick="setS('${i.id}','na')">N/A</button></div>
   <textarea placeholder="Observação (opcional)" onchange="setObs('${i.id}',this.value)">${esc(i.obs)}</textarea>
   <div class="fotos">${(i.fotos||[]).map((f,k)=>`<div class="ph"><img src="${f}" onclick="zoom(this.src)"><button onclick="rmFoto('${i.id}',${k})">×</button></div>`).join('')}<label class="add">📷<span>Foto</span><input type="file" accept="image/*" multiple hidden onchange="addFoto('${i.id}',this)"></label></div></div>`).join('')).join('')}

async function excluir(){if(!confirm('Excluir este chamado e todo o histórico?'))return;await DB.del('chamado:'+S.cur.id);await DB.del('resumo:'+S.cur.id);go('list')}

/* ---------- Editor de modelos (time Sonda) ---------- */
function vTpl(){const t=S.tpl;
  return `<div class="card"><label class="f" style="margin-top:0">Editando o checklist padrão de:</label><select onchange="trocaTipo(this.value)">${TIPOS.map(x=>`<option ${x===S.tipo?'selected':''}>${x}</option>`).join('')}</select>
  <p class="mut">Este é o <b>modelo padrão</b> de "${esc(S.tipo)}". Edite, remova ou adicione itens e anexe uma <b>foto de exemplo</b> para o técnico seguir. Depois de editar, clique em <b>Salvar modelo</b>: ele passa a ser o padrão de todos os novos chamados deste tipo.</p>
  <div class="row"><button class="pri" onclick="salvaTpl()">💾 Salvar modelo</button><button class="sec" onclick="addIt()">＋ Adicionar item</button><button class="sec" onclick="resetTpl()">Restaurar padrão</button>${can('tipo')?'<button class="lar" onclick="novoTipo()">＋ Novo tipo de estabelecimento</button><button class="del" onclick="rmTipo()">Remover tipo</button>':''}</div></div>`+
  t.map((i,k)=>`<div class="card"><div class="ed"><div><label class="f" style="margin-top:0">Grupo</label><input value="${esc(i.g)}" onchange="S.tpl[${k}].g=this.value"></div>
   <div><label class="f" style="margin-top:0">Item</label><input value="${esc(i.t)}" onchange="S.tpl[${k}].t=this.value"></div>
   <div class="full"><label class="f" style="margin-top:0">Instrução para o técnico</label><input value="${esc(i.d)}" onchange="S.tpl[${k}].d=this.value"></div></div>
   <div class="row" style="margin-top:10px">${i.ref?`<img src="${i.ref}" style="width:90px;height:68px;object-fit:cover;border-radius:8px" onclick="zoom(this.src)"><button class="del" onclick="S.tpl[${k}].ref=null;render()">Remover foto</button>`:`<label class="sec" style="padding:9px 14px;border:1.5px dashed var(--az);border-radius:10px;color:var(--az);font-weight:600;cursor:pointer">📷 Foto de exemplo<input type="file" accept="image/*" hidden onchange="refFoto(${k},this)"></label>`}
   <span class="sp"></span><button class="sec" onclick="mv(${k},-1)">↑</button><button class="sec" onclick="mv(${k},1)">↓</button><button class="del" onclick="S.tpl.splice(${k},1);render()">Excluir</button></div></div>`).join('')}

async function trocaTipo(t){S.tipo=t;S.tpl=await getTpl(t);render()}
async function refFoto(k,inp){S.tpl[k].ref=await comp(inp.files[0],800);render()}
function addIt(){S.tpl.push({id:uid(),g:S.tpl.length?S.tpl[S.tpl.length-1].g:'Novo grupo',t:'Novo item',d:'',ref:null});render();scrollTo(0,document.body.scrollHeight)}
function mv(k,d){const j=k+d;if(j<0||j>=S.tpl.length)return;[S.tpl[k],S.tpl[j]]=[S.tpl[j],S.tpl[k]];render()}
async function salvaTpl(){try{await DB.set('tpl:'+S.tipo,S.tpl);toast('Modelo salvo ✓')}catch(e){toast('⚠ Erro ao salvar')}}
async function resetTpl(){if(!confirm('Voltar ao modelo padrão original?'))return;await DB.del('tpl:'+S.tipo);S.tpl=padrao(S.tipo);render()}
async function setLogo(inp){S.logo=await comp(inp.files[0],300);await DB.set('logo',S.logo);render()}

/* ---------- Tempo / status ---------- */
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dm=d=>String(d).split('-').reverse().join('/');
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'agora':m<60?'há '+m+' min':m<1440?'há '+Math.round(m/60)+' h':fmt(t)};
const SL={exec:'Em execução hoje',ag:'Agendado',pausa:'Em andamento',late:'Atrasado',done:'Concluído'};
function resumo(c){return{id:c.id,num:c.num,unidade:c.unidade,fornecedor:c.fornecedor,cidade:c.cidade,uf:c.uf,tipo:c.tipo,data:c.data,agenda:c.agenda||c.data,upd:c.upd,pct:pct(c),hist:c.hist.slice(0,6)}}
const atv=r=>{const t0=new Date().setHours(0,0,0,0);return r.hist.some(h=>h.ts>=t0&&h.txt!=='Chamado criado')};
function stat(r){const a=r.agenda||r.data;if(r.pct>=100)return'done';if(atv(r))return'exec';return a<hoje()?'late':(r.pct>0?'pausa':'ag')}
const chip=c=>`<span class="st st-${stat(c)}">${SL[stat(c)]}</span>`;

/* ---------- Painel em tempo real ---------- */
function rowD(c){const u=c.hist[0];return `<div class="card click" onclick="abrir('${c.id}')"><div class="row"><b>#${esc(c.num)} · ${esc(c.unidade)}</b><span class="tag">${esc(c.tipo)}</span><span class="sp"></span>${chip(c)}</div>
 <div class="mut">${esc(c.fornecedor)} · ${esc(c.cidade)}/${esc(c.uf)} · agendado p/ ${dm(c.agenda||c.data)}</div>
 <div class="row" style="margin-top:6px"><div class="bar sp" style="margin:0"><i style="width:${c.pct}%"></i></div><b style="color:var(--az)">${c.pct}%</b></div>
 ${u?`<div class="mut" style="margin-top:6px">⏱ ${ago(u.ts)} · ${esc(u.quem)}: ${esc(u.txt)}</div>`:''}</div>`}
const sec=(t,l,v)=>`<h2 class="g">${t} (${l.length})</h2>`+(l.length?l.map(c=>rowD(c)).join(''):`<div class="card mut">${v}</div>`);
function vDash(){const L=S.list,h=hoje(),t0=new Date().setHours(0,0,0,0),ag=c=>c.agenda||c.data,by=k=>L.filter(c=>stat(c)===k);
  const exec=by('exec'),late=by('late'),pausa=by('pausa'),done=by('done').filter(c=>c.upd>=t0),
   agL=by('ag').sort((a,b)=>ag(a)<ag(b)?-1:1),agHoje=agL.filter(c=>ag(c)===h),prox=agL.filter(c=>ag(c)>h);
  const feed=L.flatMap(c=>c.hist.map(x=>({...x,num:c.num,un:c.unidade}))).sort((a,b)=>b.ts-a.ts).slice(0,12);
  return `<div class="live"><i></i>Ao vivo · atualizado ${S.at?S.at.toLocaleTimeString('pt-BR'):''} (a cada 8 s)</div>
  <div class="kpis"><div class="kpi"><b>${exec.length}</b><span>Em execução hoje</span></div><div class="kpi"><b>${agHoje.length}</b><span>Agendados para hoje</span></div><div class="kpi"><b>${prox.length}</b><span>Próximos agendados</span></div><div class="kpi late"><b>${late.length}</b><span>Atrasados</span></div><div class="kpi done"><b>${done.length}</b><span>Concluídos hoje</span></div></div>`
  +sec('🟢 Em execução hoje',exec,'Nenhuma execução registrada hoje ainda.')
  +sec('📅 Agendados para hoje',agHoje,'Nada agendado para hoje.')
  +sec('🗓 Próximos agendados',prox,'Sem agendamentos futuros.')
  +sec('🔴 Atrasados e parados',[...late,...pausa],'Nenhum atraso. 👏')
  +`<h2 class="g">⚡ Atividade recente</h2><div class="card"><div class="tl">${feed.map(x=>`<div><b>#${esc(x.num)} · ${esc(x.un)}</b> — ${esc(x.txt)}<br><small>${esc(x.quem)} · ${ago(x.ts)}</small></div>`).join('')||'<span class="mut">Sem atividade.</span>'}</div></div>`}
setInterval(async()=>{if(S.view==='dash'&&S.user&&!document.hidden){try{S.list=await DB.list('resumo:');S.at=new Date();if(S.view==='dash')render()}catch(e){}}},8000);

/* ---------- Tipos de estabelecimento (admin/gerente) ---------- */
async function novoTipo(){const n=(prompt('Nome do novo tipo de estabelecimento:')||'').trim();if(!n)return;if(TIPOS.includes(n))return toast('Esse tipo já existe');
  TIPOS.push(n);await DB.set('tipos',TIPOS);S.tipo=n;S.tpl=padrao(n);await DB.set('tpl:'+n,S.tpl);render();toast('Tipo criado — ajuste os itens e salve')}
async function rmTipo(){if(TIPOS.length<2||!confirm('Remover o tipo "'+S.tipo+'" e seu modelo? Chamados existentes não são afetados.'))return;
  TIPOS=TIPOS.filter(t=>t!==S.tipo);await DB.set('tipos',TIPOS);await DB.del('tpl:'+S.tipo);S.tipo=TIPOS[0];S.tpl=await getTpl(S.tipo);render()}

/* ---------- Login e usuários ---------- */
const PERF={admin:'Administrador',gerente:'Gerente',backoffice:'Backoffice'};
const can=a=>!!S.user&&({tipo:['admin','gerente'],user:['admin'],del:['admin','gerente']}[a]||[]).includes(S.user.perfil);
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sonda:'+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa(unescape(encodeURIComponent(t)))}}
const lgn=v=>v.toLowerCase().replace(/[^a-z0-9._-]/g,'');
const V=i=>document.getElementById(i).value.trim();
function vSetup(){return `<div class="card" style="max-width:420px;margin:30px auto"><h3 style="margin-top:0;color:var(--azd)">Primeiro acesso</h3><p class="mut">Crie o usuário <b>Administrador</b>. Depois você cadastra gerentes e backoffice.</p>
 <label class="f">Nome</label><input id="s_n"><label class="f">Login</label><input id="s_l" autocapitalize="none"><label class="f">Senha</label><input id="s_s" type="password">
 <button class="pri" style="margin-top:16px;width:100%" onclick="doSetup()">Criar administrador</button></div>`}
function vLogin(){return `<div class="card" style="max-width:420px;margin:30px auto"><h3 style="margin-top:0;color:var(--azd)">Entrar</h3>
 <label class="f">Login</label><input id="l_l" autocapitalize="none"><label class="f">Senha</label><input id="l_s" type="password" onkeydown="if(event.key==='Enter')doLogin()">
 <button class="pri" style="margin-top:16px;width:100%" onclick="doLogin()">Entrar</button></div>`}
function entra(u){S.user={login:u.login,nome:u.nome,perfil:u.perfil};localStorage.setItem('sess',JSON.stringify(S.user));return go('dash')}
function sair(){localStorage.removeItem('sess');S.user=null;S.view='login';render()}
async function doSetup(){const l=lgn(V('s_l')),n=V('s_n'),pw=V('s_s');if(!l||!n||pw.length<4)return toast('Preencha tudo (senha com 4+ caracteres)');
  const u={login:l,nome:n,perfil:'admin',h:await sha(pw)};await DB.set('user:'+l,u);entra(u)}
async function doLogin(){const u=await DB.get('user:'+lgn(V('l_l')));if(!u||u.h!==await sha(document.getElementById('l_s').value))return toast('Usuário ou senha inválidos');entra(u)}
function vUsers(){return `<div class="card"><h3 style="margin-top:0;color:var(--azd)">Novo usuário</h3><div class="grid"><div><label class="f">Nome</label><input id="u_n"></div><div><label class="f">Login</label><input id="u_l" autocapitalize="none"></div>
 <div><label class="f">Senha</label><input id="u_s" type="password"></div><div><label class="f">Perfil</label><select id="u_p">${Object.entries(PERF).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div>
 <p class="mut">Administrador: tudo + usuários · Gerente: cria tipos de estabelecimento, exclui chamados · Backoffice: cria chamados, edita e salva modelos.</p>
 <button class="pri" onclick="addUser()">Adicionar usuário</button></div>`+S.users.map(u=>`<div class="card row"><div><b>${esc(u.nome)}</b><div class="mut">${esc(u.login)} · ${PERF[u.perfil]}</div></div><span class="sp"></span><button class="sec" onclick="novaSenha('${esc(u.login)}')">Nova senha</button>${u.login===S.user.login?'':`<button class="del" onclick="rmUser('${esc(u.login)}')">Remover</button>`}</div>`).join('')}
async function addUser(){const l=lgn(V('u_l')),n=V('u_n'),pw=V('u_s');if(!l||!n||pw.length<4)return toast('Preencha tudo (senha com 4+ caracteres)');
  if(await DB.get('user:'+l))return toast('Esse login já existe');await DB.set('user:'+l,{login:l,nome:n,perfil:document.getElementById('u_p').value,h:await sha(pw)});go('users')}
async function novaSenha(l){const pw=prompt('Nova senha para '+l+':');if(!pw||pw.length<4)return;const u=await DB.get('user:'+l);u.h=await sha(pw);await DB.set('user:'+l,u);toast('Senha alterada ✓')}
async function rmUser(l){if(!confirm('Remover o usuário '+l+'?'))return;await DB.del('user:'+l);go('users')}

/* ---------- Exportação: fotos (ZIP) e Book (PDF) ---------- */
const slug=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);
function dl(blob,nome){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function expZip(){const c=S.cur;if(typeof JSZip==='undefined')return toast('Biblioteca ZIP não carregou (verifique a internet)');
  const z=new JSZip(),gs=[...new Set(c.itens.map(i=>i.g))];let n=0;
  gs.forEach((g,gi)=>c.itens.filter(i=>i.g===g).forEach((i,ii)=>(i.fotos||[]).forEach((f,k)=>{n++;z.file(`${String(gi+1).padStart(2,'0')}_${slug(g)}/${String(ii+1).padStart(2,'0')}_${slug(i.t)}_${k+1}.jpg`,f.split(',')[1],{base64:true})})));
  if(!n)return toast('Nenhuma foto de evidência neste chamado');
  dl(await z.generateAsync({type:'blob'}),`Fotos_${slug(c.num)}_${slug(c.unidade)}.zip`);toast(n+' fotos exportadas ✓')}
function book(){const c=S.cur,gs=[...new Set(c.itens.map(i=>i.g))],w=window.open('','_blank');if(!w)return toast('Libere os pop-ups para gerar o book');
  const css=`@page{size:A4;margin:12mm}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{font-family:Arial,sans-serif;color:#1B2430;margin:0}
  .cap{background:#1F5DF5;color:#fff;min-height:270mm;padding:30mm 16mm;page-break-after:always}.cap img{height:70px}.cap h1{font-size:34px;margin:50px 0 6px}.cap p{font-size:16px;margin:6px 0;opacity:.95}
  h2{background:#0B2A7A;color:#fff;padding:8px 12px;border-radius:6px;font-size:15px;margin:18px 0 10px;page-break-after:avoid}
  .it{border:1px solid #DCE4F7;border-left:6px solid #1F5DF5;border-radius:8px;padding:10px;margin-bottom:10px;page-break-inside:avoid}.it.nok{border-left-color:#D93A3A}.it.ok{border-left-color:#1E9E5A}
  .it b{font-size:13px}.stt{float:right;font-size:11px;font-weight:700;color:#555}.obs{font-size:12px;color:#444;margin:4px 0}
  .ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.ph figure{margin:0;width:32%}.ph img{width:100%;height:120px;object-fit:cover;border-radius:6px}.ph figcaption{font-size:10px;color:#1F5DF5;font-weight:700}.sem{font-size:11px;color:#999}`;
  const corpo=`<div class="cap"><img src="${LOGO}"><h1>Book de Execução</h1><p><b>Chamado:</b> ${esc(c.num)}</p><p><b>Unidade:</b> ${esc(c.unidade)}</p><p><b>Tipo:</b> ${esc(c.tipo)}</p><p><b>Fornecedor:</b> ${esc(c.fornecedor)}</p><p><b>Local:</b> ${esc(c.cidade)}/${esc(c.uf)}</p><p><b>Data do registro:</b> ${dm(c.data)}</p><p><b>Execução:</b> ${pct(c)}% concluído</p><p style="margin-top:40px;font-size:12px">Gerado em ${fmt(Date.now())} por ${esc(quem())}</p></div>`+
   gs.map(g=>`<h2>${esc(g)}</h2>`+c.itens.filter(i=>i.g===g).map(i=>`<div class="it ${i.s}"><span class="stt">${ST[i.s]}</span><b>${esc(i.t)}</b>${i.obs?`<div class="obs">Obs.: ${esc(i.obs)}</div>`:''}
    <div class="ph">${i.ref?`<figure><img src="${i.ref}"><figcaption>PADRÃO</figcaption></figure>`:''}${(i.fotos||[]).map((f,k)=>`<figure><img src="${f}"><figcaption>EVIDÊNCIA ${k+1}</figcaption></figure>`).join('')}${(i.fotos||[]).length?'':'<span class="sem">Sem evidência fotográfica</span>'}</div></div>`).join('')).join('');
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Book ${esc(c.num)} - ${esc(c.unidade)}</title><style>${css}</style></head><body>${corpo}</body></html>`);w.document.close();setTimeout(()=>w.print(),700)}

/* ---------- Início ---------- */
(async()=>{
  if(FORN){head();await abrir(P.get('c'));quem();return}
  TIPOS=(await DB.get('tipos'))||TIPOS;
  const us=await DB.list('user:');
  if(!us.length){S.view='setup';return render()}
  try{const ss=JSON.parse(localStorage.getItem('sess')||'null'),u=ss&&us.find(x=>x.login===ss.login);if(u)return entra(u)}catch(e){}
  S.view='login';render()
})();
</script>
</body>
</html>
